<template>
  <style>
      #root {
        position: absolute;
        inset: 0;
        --ground: #f5ecd7;
        --ground-edge: #ecdfc2;
        --ink: #3d2817;
        --marker: rgba(255, 210, 40, 0.62);
        --font-type: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      #hook-stage {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* warm paper: a soft lighter centre falling to a slightly deeper cream at the edges */
        background:
          radial-gradient(ellipse 80% 60% at 50% 46%, rgba(255, 250, 238, 0.85), rgba(255, 250, 238, 0) 70%),
          linear-gradient(180deg, var(--ground) 0%, var(--ground-edge) 100%);
      }
      #hook-type {
        --blink: 1;
        width: 900px;
        font-family: var(--font-type);
        font-size: 72px;
        font-weight: 500;
        line-height: 1.5;
        letter-spacing: 0;
        color: var(--ink);
        text-align: center;
      }
      /* each typed character; hidden glyphs keep their space so the centred layout never shifts */
      #hook-type .ch {
        position: relative;
        z-index: 1;
        opacity: 0;
      }
      #hook-type .caret-start {
        position: relative;
        display: inline-block;
        width: 0;
      }
      /* the text cursor rides on whichever character was typed last (--on), and blinks with --blink */
      #hook-type .ch::after,
      #hook-type .caret-start::after {
        content: "";
        position: absolute;
        left: 100%;
        top: 0.08em;
        height: 1.12em;
        width: 0.09em;
        margin-left: 0.04em;
        border-radius: 2px;
        background: var(--ink);
        opacity: calc(var(--on, 0) * var(--blink));
      }
      #hook-type .caret-start {
        --on: 1;
      }
      #hook-type .caret-start::after {
        top: -0.92em;
      }
      /* the highlighted phrase */
      #hook-type .hl {
        position: relative;
        white-space: nowrap;
      }
      #hook-mark {
        position: absolute;
        z-index: 0;
        left: -0.22em;
        right: -0.26em;
        top: 0.18em;
        bottom: 0.08em;
        clip-path: inset(0 100% 0 0);
        mix-blend-mode: multiply;
        pointer-events: none;
      }
      /* two overlapping strokes with different, uneven ends read as one hand-drawn marker pass */
      #hook-mark .stroke {
        position: absolute;
        background: var(--marker);
      }
      #hook-mark .s1 {
        left: 0;
        right: 0.6%;
        top: 8%;
        bottom: 10%;
        border-radius: 18px 30px 22px 12px / 34px 16px 30px 20px;
        transform: rotate(-0.9deg);
      }
      #hook-mark .s2 {
        left: 1.4%;
        right: 0;
        top: 20%;
        bottom: 2%;
        border-radius: 26px 14px 34px 20px / 18px 30px 14px 32px;
        transform: rotate(0.6deg);
        opacity: 0.55;
      }
      </style>
  <div id="root" data-composition-id="hook" data-width="1080" data-height="1920">
    <div id="hook-stage" class="clip" data-start="0" data-duration="6">
      <p id="hook-type"><span class="caret-start"></span>Here is what<br /><span class="hl"><span id="hook-mark" aria-hidden="true"><span class="stroke s1"></span><span class="stroke s2"></span></span>nobody tells you</span><br />about saving money</p>
    </div>
  </div>
  <script>
      // ---- timing (seconds) ----
      const TYPE_START = 0.45; // cursor sits ready at the start before the first key
      const TYPE_END = 3.95; // last character lands
      const SWEEP_START = 4.05;
      const SWEEP_DUR = 0.7;
      const BLINK_HALF = 0.5; // cursor on 0.5 s, off 0.5 s
      const VIDEO_END = 6;

      // Split every text node in #hook-type into one span per character (deterministic, skips the marker).
      const typeEl = document.getElementById("hook-type");
      const chars = [];
      const walk = (node) => {
        Array.from(node.childNodes).forEach((child) => {
          if (child.nodeType === Node.TEXT_NODE) {
            const frag = document.createDocumentFragment();
            for (const c of child.textContent) {
              const s = document.createElement("span");
              s.className = "ch";
              s.textContent = c;
              frag.appendChild(s);
              chars.push(s);
            }
            child.replaceWith(frag);
          } else if (child.nodeType === Node.ELEMENT_NODE && child.id !== "hook-mark") {
            walk(child);
          }
        });
      };
      walk(typeEl);

      const caretStart = typeEl.querySelector(".caret-start");
      const tl = gsap.timeline({ paused: true });

      // Initial state, set on the timeline so seeking back to 0 restores it.
      tl.set(chars, { opacity: 0, "--on": 0 }, 0);
      tl.set(caretStart, { "--on": 1 }, 0);
      tl.set("#hook-mark", { clipPath: "inset(0% 100% 0% 0%)" }, 0);

      // Typing: a steady pace, the cursor moving to each new character.
      const step = (TYPE_END - TYPE_START) / (chars.length - 1);
      chars.forEach((ch, i) => {
        const t = TYPE_START + i * step;
        tl.set(ch, { opacity: 1, "--on": 1 }, t);
        tl.set(i === 0 ? caretStart : chars[i - 1], { "--on": 0 }, t);
      });

      // Cursor blink: solid from the start and while typing, blinking once the line is done.
      tl.set(typeEl, { "--blink": 1 }, 0);
      const firstBlinkAfter = Math.ceil((TYPE_END + 0.05) / (BLINK_HALF * 2)) * BLINK_HALF * 2;
      for (let t = firstBlinkAfter; t < VIDEO_END; t += BLINK_HALF * 2) {
        tl.set(typeEl, { "--blink": 1 }, t);
        tl.set(typeEl, { "--blink": 0 }, t + BLINK_HALF);
      }

      // Marker sweep, left to right, a quick hand-like stroke that eases into the end.
      tl.to(
        "#hook-mark",
        { clipPath: "inset(0% 0% 0% 0%)", duration: SWEEP_DUR, ease: "power2.out" },
        SWEEP_START,
      );

      // Pin the timeline to the full video length so the hold frame keeps blinking to 6 s.
      tl.set({}, {}, VIDEO_END);

      window.__timelines = window.__timelines || {};
      window.__timelines["hook"] = tl;
      tl.seek(0);
      </script>
</template>
