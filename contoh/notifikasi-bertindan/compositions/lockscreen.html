  <script>
      const tl = gsap.timeline({ paused: true });

      // Stack geometry: each step back slides down and shrinks, leaving a thin strip.
      const STEP_Y = 26;
      const STEP_SCALE = 0.055;
      const SHADE = 0.1;
      const ARRIVE = [0.45, 1.35, 2.25]; // one card every 0.9 s
      const cards = ["#card1", "#card2", "#card3"];

      // Wallpaper breathes very slowly so the frame never feels frozen.
      tl.fromTo("#wall", { scale: 1.06, x: -20, y: 10 }, { scale: 1, x: 20, y: -10, duration: 5, ease: "none" }, 0);

      // Clock settles in.
      tl.fromTo("#clock", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo(["#status", "#lockicon", "#home"], { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0);

      // Cards start hidden above the stack.
      tl.set(cards, { y: -520, scale: 1, opacity: 0 }, 0);

      cards.forEach((card, i) => {
        const t = ARRIVE[i];
        // The new card drops in from the top.
        tl.fromTo(
          card,
          { y: -520, opacity: 0, scale: 1.02 },
          { y: 0, opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.15)", immediateRender: false },
          t
        );
        // Every older card moves one step further back.
        for (let j = 0; j < i; j++) {
          const depth = i - j;
          const prev = depth - 1;
          tl.fromTo(
            cards[j],
            { y: prev * STEP_Y, scale: 1 - prev * STEP_SCALE },
            { y: depth * STEP_Y, scale: 1 - depth * STEP_SCALE, duration: 0.5, ease: "power3.out", immediateRender: false },
            t + 0.08
          );
          tl.fromTo(
            cards[j] + " .shade",
            { opacity: prev * SHADE },
            { opacity: depth * SHADE, duration: 0.5, ease: "power2.out", immediateRender: false },
            t + 0.08
          );
        }
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["lockscreen"] = tl;
    </script>
