<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"title","type":"string","label":"Title","default":"Sales, January to April"},{"id":"note","type":"string","label":"Note","default":"+50% on February"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f6f4ef;
        --ink: #2e2e2e;
        --ink-soft: #66625c;
        --bar: #6f8fb0;
        --accent: #e8735a;
        --accent-ink: #b4462e;
        --rule: #d9d5cc;
        --font-display: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        font-family: var(--font-display);
        color: var(--ink);
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      #title {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 150px;
        text-align: center;
        font-size: 68px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
        color: var(--ink);
      }
      /* Chart geometry: baseline at y=1560, bars 170 wide with 70 gaps, 27k = 860 px. */
      #axis {
        position: absolute;
        left: 80px;
        right: 80px;
        top: 1560px;
        height: 4px;
        border-radius: 2px;
        background: var(--rule);
        transform-origin: left center;
      }
      .col {
        position: absolute;
        top: 560px;
        width: 170px;
        height: 1000px; /* clips the bar below the baseline while it rises */
        overflow: hidden;
      }
      .bar {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        border-radius: 26px 26px 0 0;
        background: var(--bar);
      }
      .value {
        position: absolute;
        width: 170px;
        text-align: center;
        font-size: 50px;
        font-weight: 700;
        line-height: 60px;
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .month {
        position: absolute;
        top: 1596px;
        width: 170px;
        text-align: center;
        font-size: 40px;
        font-weight: 600;
        line-height: 48px;
        color: var(--ink-soft);
      }
      #note {
        position: absolute;
        right: 95px;
        top: 540px;
        font-size: 48px;
        font-weight: 700;
        line-height: 56px;
        white-space: nowrap;
        color: var(--accent-ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-width="1080"
      data-height="1920"
    >
      <div id="scene" data-layout-allow-overlap>
        <h1 id="title" data-var-text="title">Sales, January to April</h1>

        <div id="col-jan" class="col" style="left: 95px"><div id="bar-jan" class="bar" style="height: 382px"></div></div>
        <div id="col-feb" class="col" style="left: 335px"><div id="bar-feb" class="bar" style="height: 573px"></div></div>
        <div id="col-mar" class="col" style="left: 575px"><div id="bar-mar" class="bar" style="height: 287px"></div></div>
        <div id="col-apr" class="col" style="left: 815px"><div id="bar-apr" class="bar" style="height: 860px"></div></div>

        <div id="axis"></div>

        <div id="val-jan" class="value" style="left: 95px; top: 1102px">0k</div>
        <div id="val-feb" class="value" style="left: 335px; top: 911px">0k</div>
        <div id="val-mar" class="value" style="left: 575px; top: 1197px">0k</div>
        <div id="val-apr" class="value" style="left: 815px; top: 624px">0k</div>

        <div id="mon-jan" class="month" style="left: 95px">Jan</div>
        <div id="mon-feb" class="month" style="left: 335px">Feb</div>
        <div id="mon-mar" class="month" style="left: 575px">Mar</div>
        <div id="mon-apr" class="month" style="left: 815px">Apr</div>

        <div id="note" data-var-text="note">+50% on February</div>
      </div>
    </div>
    <script>
      const data = [
        { id: "jan", value: 12, height: 382 },
        { id: "feb", value: 18, height: 573 },
        { id: "mar", value: 9, height: 287 },
        { id: "apr", value: 27, height: 860 },
      ];
      const START = 0.8;
      const STAGGER = 0.35;
      const GROW = 1.0;

      const tl = gsap.timeline({ paused: true });

      // Frame first: title, then the baseline, then the month labels.
      tl.fromTo("#title", { opacity: 0, y: -24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.05);
      tl.fromTo("#axis", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.inOut" }, 0.25);
      tl.fromTo(".month", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out", stagger: 0.06 }, 0.45);

      // Bars rise one after another with a slight overshoot; each value rides on top and counts up.
      data.forEach((d, i) => {
        const t = START + i * STAGGER;
        const bar = "#bar-" + d.id;
        const val = "#val-" + d.id;
        tl.fromTo(bar, { y: d.height }, { y: 0, duration: GROW, ease: "back.out(1.5)" }, t);
        tl.fromTo(val, { y: d.height }, { y: 0, duration: GROW, ease: "back.out(1.5)" }, t);
        tl.fromTo(val, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "none" }, t);
        const counter = { v: 0 };
        const el = document.querySelector(val);
        tl.to(
          counter,
          {
            v: d.value,
            duration: GROW * 0.85,
            ease: "power2.out",
            onUpdate: () => {
              el.textContent = Math.round(counter.v) + "k";
            },
          },
          t
        );
      });

      // All four are up: April turns coral, then the note fades in above it.
      const allUp = START + 3 * STAGGER + GROW + 0.1;
      tl.to("#bar-apr", { backgroundColor: "#e8735a", duration: 0.5, ease: "power2.inOut" }, allUp);
      tl.to("#val-apr", { color: "#b4462e", duration: 0.5, ease: "power2.inOut" }, allUp);
      tl.fromTo("#note", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, allUp + 0.3);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
