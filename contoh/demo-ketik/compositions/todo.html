  <script>
      // Canvas positions of the two tap targets.
      // Screen origin = phone (160,180) + bezel 22 = (182,202); screen is 716 x 1516.
      const ADD = { x: 540, y: 202 + 1516 - 60 - 60 }; // centre of "Add task" button -> y 1598
      const CHECK = { x: 182 + 48 + 32 + 28, y: 202 + 400 + 65 }; // new row checkbox -> (290, 667)
      const START = { x: 830, y: 1240 };
      const STEP = 152; // row height 130 + gap 22

      const tl = gsap.timeline({ paused: true });

      // Initial states, applied before the timeline is built
      gsap.set("#touch", { x: START.x, y: START.y, opacity: 0, scale: 1 });
      gsap.set("#ripple-add", { x: ADD.x, y: ADD.y, scale: 0, opacity: 0 });
      gsap.set("#ripple-check", { x: CHECK.x, y: CHECK.y, scale: 0, opacity: 0 });
      gsap.set("#row-new", { opacity: 0, y: -50, scale: 0.96 });
      gsap.set("#row-new-glow", { opacity: 0 });
      gsap.set(["#row-old1", "#row-old2"], { y: 0 });
      gsap.set("#count-3", { opacity: 0, y: 16 });
      gsap.set("#count-2", { opacity: 1, y: 0 });
      gsap.set("#box-new-fill", { opacity: 0, scale: 0.4 });
      gsap.set("#tick-path", { strokeDashoffset: 40 });
      gsap.set("#strike", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#task-new", { color: "#17181c" });
      gsap.set("#add-btn", { scale: 1 });

      // Phone settles in
      tl.fromTo("#phone", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0);

      // 0.7s: marker appears, 1.0s glides to "Add task"
      tl.to("#touch", { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.7);
      tl.to("#touch", { x: ADD.x, y: ADD.y, duration: 0.6, ease: "power2.inOut" }, 1.0);

      // 1.6s: tap
      tl.to("#touch", { scale: 0.82, duration: 0.1, ease: "power2.in" }, 1.6);
      tl.to("#add-btn", { scale: 0.96, duration: 0.1, ease: "power2.in" }, 1.6);
      tl.to("#touch", { scale: 1, duration: 0.2, ease: "power2.out" }, 1.7);
      tl.to("#add-btn", { scale: 1, duration: 0.25, ease: "back.out(2)" }, 1.7);
      tl.to("#ripple-add", { opacity: 1, duration: 0.05 }, 1.65);
      tl.to("#ripple-add", { scale: 1, duration: 0.45, ease: "power2.out" }, 1.65);
      tl.to("#ripple-add", { opacity: 0, duration: 0.35, ease: "power1.in" }, 1.8);

      // 1.85s: new row slides in at the top, pushes others down
      tl.to(["#row-old1", "#row-old2"], { y: STEP, duration: 0.5, ease: "power3.out", stagger: 0.04 }, 1.85);
      tl.to("#row-new", { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 1.95);
      tl.to("#row-new-glow", { opacity: 1, duration: 0.2 }, 2.0);
      tl.to("#row-new-glow", { opacity: 0, duration: 0.6, ease: "power1.out" }, 2.6);
      tl.to("#count-2", { opacity: 0, y: -16, duration: 0.25, ease: "power2.in" }, 1.95);
      tl.to("#count-3", { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, 2.15);

      // Marker travels to the new row's checkbox, arrives just before 4s
      tl.to("#touch", { x: CHECK.x, y: CHECK.y, duration: 1.0, ease: "power2.inOut" }, 2.85);

      // 4.0s: tap the checkbox
      tl.to("#touch", { scale: 0.82, duration: 0.1, ease: "power2.in" }, 3.9);
      tl.to("#touch", { scale: 1, duration: 0.2, ease: "power2.out" }, 4.0);
      tl.to("#ripple-check", { opacity: 1, duration: 0.05 }, 4.0);
      tl.to("#ripple-check", { scale: 0.75, duration: 0.45, ease: "power2.out" }, 4.0);
      tl.to("#ripple-check", { opacity: 0, duration: 0.35, ease: "power1.in" }, 4.15);
      tl.to("#box-new-fill", { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.2)" }, 4.0);
      tl.to("#tick-path", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, 4.12);
      tl.to("#strike", { scaleX: 1, duration: 0.35, ease: "power2.inOut" }, 4.25);
      tl.to("#task-new", { color: "#8a8c93", duration: 0.35, ease: "power1.out" }, 4.3);

      // Marker lifts away; hold the finished state
      tl.to("#touch", { opacity: 0, scale: 1.15, duration: 0.4, ease: "power1.in" }, 4.7);
      tl.to({}, { duration: 0.01 }, 5.98);

      window.__timelines = window.__timelines || {};
      window.__timelines["todo"] = tl;
      </script>
