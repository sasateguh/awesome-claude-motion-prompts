  <script>
      // Split the typed text into per-letter spans (deterministic, done once before the timeline is built).
      function splitChars(el) {
        const text = el.textContent;
        el.textContent = "";
        const out = [];
        for (const c of text) {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          el.appendChild(s);
          out.push(s);
        }
        return out;
      }
      // Optional overrides from composition variables (query typed, completion added on choose)
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      if (typeof vars.query === "string" && vars.query) document.getElementById("typed").textContent = vars.query;
      if (typeof vars.completion === "string") document.getElementById("extra").textContent = vars.completion;
      const typed = splitChars(document.getElementById("typed"));
      const extra = splitChars(document.getElementById("extra"));

      const tl = gsap.timeline({ paused: true });

      // Timing (seconds)
      const TYPE_START = 0.45;
      const PER_CHAR = 0.075;
      const CHOOSE = 2.75;
      const CLOSE = 2.95;
      const CARDS = 3.25;

      // Focus the bar
      tl.to("#bar-ring", { opacity: 1, duration: 0.2, ease: "power2.out" }, 0.25);
      tl.to("#bar", { backgroundColor: "#ffffff", duration: 0.2, ease: "power2.out" }, 0.25);

      // Type one letter at a time
      tl.set("#placeholder", { opacity: 0 }, TYPE_START);
      typed.forEach((s, i) => tl.set(s, { display: "inline" }, TYPE_START + i * PER_CHAR));
      const typingEnd = TYPE_START + typed.length * PER_CHAR;

      // Dropdown opens after the third word ("near")
      const words = typed.map((s) => s.textContent).join("").split(" ");
      const thirdWordEnd = TYPE_START + words.slice(0, 3).join(" ").length * PER_CHAR;
      tl.fromTo(
        "#drop",
        { opacity: 0, scaleY: 0.92, y: -12 },
        { opacity: 1, scaleY: 1, y: 0, duration: 0.24, ease: "power3.out" },
        thirdWordEnd + 0.04
      );
      tl.fromTo(
        ".sug span, .sug svg",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.2, stagger: 0.05, ease: "power2.out" },
        thirdWordEnd + 0.1
      );

      // Finger moves in and hovers the second suggestion
      tl.fromTo("#touch", { opacity: 0, x: 120, y: 260, scale: 1.2 }, { opacity: 1, x: 0, y: 0, scale: 1, duration: 0.45, ease: "power3.out" }, 1.85);
      tl.to("#sug2 .sug-bg", { opacity: 1, duration: 0.18, ease: "power1.out" }, 2.2);
      // Press and choose
      tl.to("#touch", { scale: 0.82, duration: 0.1, ease: "power2.in" }, CHOOSE - 0.15);
      tl.to("#sug2 .sug-bg", { backgroundColor: "#d3e3fd", duration: 0.1 }, CHOOSE - 0.15);
      tl.to("#touch", { scale: 1, opacity: 0, duration: 0.25, ease: "power2.out" }, CHOOSE);
      extra.forEach((s) => tl.set(s, { display: "inline" }, CHOOSE));

      // Dropdown closes
      tl.to("#drop", { opacity: 0, scaleY: 0.94, y: -10, duration: 0.2, ease: "power2.in" }, CLOSE);

      // Search submitted: the field loses focus
      tl.to("#bar-ring", { opacity: 0, duration: 0.25 }, CARDS - 0.1);
      tl.to("#bar", { backgroundColor: "#f3f4f7", duration: 0.25 }, CARDS - 0.1);

      // Cursor: solid while typing, blinking otherwise, gone after submit
      const blinkOff = [];
      for (let t = 0; t < CARDS - 0.1; t += 0.5) blinkOff.push(t + 0.25);
      blinkOff.forEach((t) => {
        if (t >= TYPE_START - 0.05 && t <= typingEnd + 0.2) return;
        tl.set("#cursor", { opacity: 0 }, t);
        tl.set("#cursor", { opacity: 1 }, Math.min(t + 0.25, CARDS - 0.1));
      });
      tl.set("#cursor", { opacity: 0 }, CARDS - 0.1);

      // Results slide up from the bottom, one after another
      tl.fromTo("#results-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, CARDS - 0.05);
      ["#card1", "#card2", "#card3"].forEach((id, i) => {
        tl.fromTo(
          id,
          { opacity: 0, y: 1100 },
          { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
          CARDS + i * 0.28
        );
      });

      // Hold the final state until the end
      tl.set({}, {}, 6);

      window.__timelines = window.__timelines || {};
      window.__timelines["search"] = tl;
    </script>
