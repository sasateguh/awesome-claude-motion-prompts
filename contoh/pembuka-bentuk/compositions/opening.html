  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });

      // Fixed, hand-picked spread so every render is identical (no Math.random).
      const jitter = [6, -7, 3, -4, 8, -2, 5, -8, 2, -5, 7, -3, 4, -6, 1, -7, 6, -1, 3, -4];
      const reach = [430, 300, 380, 250, 410, 330, 280, 440, 360, 230, 400, 310, 350, 270, 420, 290, 370, 240, 390, 320];
      const size = [1, 0.75, 1.15, 0.85, 0.7, 1.1, 0.9, 1.2, 0.8, 1, 0.75, 1.15, 0.9, 1.05, 0.8, 1.2, 0.7, 1, 0.95, 0.85];
      const spin = [540, -420, 360, -600, 480, -360, 600, -480, 420, -540, 360, -600, 540, -420, 480, -360, 600, -480, 420, -540];

      const shapes = gsap.utils.toArray("#op-shapes .op-shape");
      shapes.forEach((el, i) => {
        const a = ((i * 18 + jitter[i]) * Math.PI) / 180;
        const x = Math.cos(a) * reach[i];
        const y = Math.sin(a) * reach[i] * 1.7; // taller spread for the vertical frame

        // 0.2 s: burst out from the centre, spinning, slowing with an ease-out.
        tl.fromTo(
          el,
          { x: 0, y: 0, rotation: 0, scale: 0.2, opacity: 0 },
          { x: x, y: y, rotation: spin[i], scale: size[i], opacity: 1, duration: 1.6, ease: "expo.out" },
          0.2 + (i % 4) * 0.015,
        );
        // 1.8 s: pulled back to the centre, accelerating in.
        tl.fromTo(
          el,
          { x: x, y: y, rotation: spin[i], scale: size[i] },
          { x: 0, y: 0, rotation: spin[i] + spin[i] * 0.5, scale: 0.35, duration: 0.55, ease: "power3.in", immediateRender: false },
          1.8 + (i % 5) * 0.012,
        );
        tl.fromTo(el, { opacity: 1 }, { opacity: 0, duration: 0.12, ease: "none", immediateRender: false }, 2.3);
      });

      // 2.28 s: the shapes merge into one coral rounded rectangle.
      tl.fromTo(
        "#op-card",
        { opacity: 0, scale: 0.1, rotation: -8, borderRadius: 300 },
        { opacity: 1, scale: 1, rotation: 0, borderRadius: 56, duration: 0.6, ease: "back.out(1.5)" },
        2.28,
      );

      // Text slides up inside the card.
      tl.fromTo("#op-episode", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power3.out" }, 2.75);
      tl.fromTo("#op-title", { yPercent: 105 }, { yPercent: 0, duration: 0.6, ease: "power3.out" }, 2.9);

      // Title card holds from 3.5 s to the end (final second and more).
      tl.to({}, { duration: 0.01 }, 4.99);

      window.__timelines = window.__timelines || {};
      window.__timelines["opening"] = tl;
    })();
  </script>
