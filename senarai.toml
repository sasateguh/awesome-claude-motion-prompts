[[prompt]]
id = "kapsyen-sorot"
kategori = "kinetik"
hasil = "contoh/kapsyen-sorot"
[prompt.en]
tajuk = "Word by word caption highlight"
prompt = """Make a 6 second vertical video, 1080 by 1920, that shows a reel caption timed to speech.
The sentence is: "Most people quit one week before it starts working."
Show three or four words at a time in the lower third, in a bold sans-serif system font about 88 px, white with a soft dark shadow, on a charcoal background with a gentle vertical gradient.
Pace it at about two and a half words per second. The word being spoken turns yellow and grows 10 percent with a quick ease-out, then settles back when the next word starts.
Each group of words rises 30 px into place as it appears and fades out just before the next group.
Use only HTML, CSS and system fonts, with no images, icons or fonts from outside."""
[prompt.ms]
tajuk = "Kapsyen sorot perkataan demi perkataan"
prompt = """Buat video menegak 6 saat, 1080 x 1920, yang memaparkan kapsyen reel mengikut rentak percakapan.
Ayatnya: "Ramai orang berhenti seminggu sebelum usaha mereka mula menjadi."
Papar tiga atau empat perkataan pada satu masa di sepertiga bawah, dalam fon sistem sans-serif tebal kira-kira 88 px, putih dengan bayang gelap lembut, atas latar arang dengan gradien menegak yang halus.
Rentaknya kira-kira dua setengah perkataan sesaat. Perkataan yang sedang disebut bertukar kuning dan membesar 10 peratus dengan ease-out pantas, kemudian kembali biasa bila perkataan seterusnya bermula.
Setiap kumpulan perkataan naik 30 px ke tempatnya semasa muncul dan pudar sebelum kumpulan seterusnya.
Guna HTML, CSS dan fon sistem sahaja, tanpa imej, ikon atau fon dari luar."""

[[prompt]]
id = "tajuk-hentak"
kategori = "kinetik"
hasil = "contoh/tajuk-hentak"
[prompt.en]
tajuk = "Stacked headline slam"
prompt = """Make a 5 second vertical video, 1080 by 1920, with a three line headline on a near-black background.
The lines are "Stop", "posting" and "randomly", stacked and centred, in a heavy condensed sans-serif system font that fills about 80 percent of the width.
Each line slams in 0.4 seconds after the one before: it starts at 140 percent scale and lands at 100 percent with a small overshoot. Alternate the colours white, orange, white.
When the last line lands, give the whole block one short shake of a few pixels, then hold.
In the final second, draw an orange underline from left to right under "randomly".
Use only HTML, CSS and system fonts, with no images, icons or fonts from outside."""
[prompt.ms]
tajuk = "Tajuk bertindan menghentak"
prompt = """Buat video menegak 5 saat, 1080 x 1920, dengan tajuk tiga baris atas latar hampir hitam.
Barisnya "Berhenti", "posting" dan "ikut suka", bertindan dan di tengah, dalam fon sistem sans-serif tebal yang sempit dan memenuhi kira-kira 80 peratus lebar.
Setiap baris menghentak masuk 0.4 saat selepas baris sebelumnya: bermula pada skala 140 peratus dan mendarat pada 100 peratus dengan sedikit lajakan. Selang-selikan warna putih, oren, putih.
Bila baris terakhir mendarat, goncang seluruh blok sekali dengan pendek beberapa piksel, kemudian tahan.
Pada saat terakhir, lukis garis bawah oren dari kiri ke kanan di bawah "ikut suka".
Guna HTML, CSS dan fon sistem sahaja, tanpa imej, ikon atau fon dari luar."""

[[prompt]]
id = "mesin-taip-sorot"
kategori = "kinetik"
hasil = "contoh/mesin-taip-sorot"
[prompt.en]
tajuk = "Typewriter hook with marker sweep"
prompt = """Make a 6 second vertical video, 1080 by 1920, that types an opening hook on a warm cream background.
Type "Here is what nobody tells you about saving money" letter by letter at a steady pace in a monospace system font, dark brown, about 72 px, wrapped across three or four centred lines, with a blinking text cursor at the end.
When the typing finishes, sweep a translucent yellow marker highlight from left to right behind the words "nobody tells you", as if drawn by hand, slightly uneven at the edges.
Hold the finished frame for the last second while the cursor keeps blinking.
Use only HTML, CSS and system fonts, with no images, icons or fonts from outside."""
[prompt.ms]
tajuk = "Cangkuk mesin taip dengan sapuan penanda"
prompt = """Buat video menegak 6 saat, 1080 x 1920, yang menaip ayat pembuka atas latar krim hangat.
Taip "Ini perkara yang tiada siapa beritahu tentang menyimpan duit" huruf demi huruf pada rentak tetap dalam fon sistem monospace, coklat gelap, kira-kira 72 px, dibalut kepada tiga atau empat baris di tengah, dengan kursor teks berkelip di hujung.
Bila menaip selesai, sapu sorotan penanda kuning lut cahaya dari kiri ke kanan di belakang perkataan "tiada siapa beritahu", seolah-olah dilukis dengan tangan, tepinya sedikit tidak rata.
Tahan bingkai akhir pada saat terakhir sementara kursor terus berkelip.
Guna HTML, CSS dan fon sistem sahaja, tanpa imej, ikon atau fon dari luar."""

[[prompt]]
id = "logo-garis"
kategori = "jenama"
hasil = "contoh/logo-garis"
[prompt.en]
tajuk = "Line drawn logo reveal"
prompt = """Make a 5 second vertical video, 1080 by 1920, that reveals a logo for a made-up coffee shop called "Kopi Senja".
Build the logo as inline SVG: a circle with a simple coffee cup outline inside it and two curved steam lines above the cup.
For the first 1.5 seconds, draw every stroke as if with a pen, using an animated stroke dash offset, in a warm brown on an off-white background.
Then fill the circle with deep orange and turn the strokes cream, over 0.4 seconds.
After that, fade the name "Kopi Senja" up letter by letter beneath the logo in a serif system font, followed by the smaller line "Since 2019".
Use only HTML, CSS, inline SVG and system fonts, with no images, icons or fonts from outside."""
[prompt.ms]
tajuk = "Logo dilukis garis demi garis"
prompt = """Buat video menegak 5 saat, 1080 x 1920, yang memperkenalkan logo sebuah kedai kopi rekaan bernama "Kopi Senja".
Bina logo sebagai SVG sebaris: satu bulatan dengan garis luar cawan kopi yang ringkas di dalamnya dan dua garis wap melengkung di atas cawan.
Untuk 1.5 saat pertama, lukis setiap garis seolah-olah dengan pen, menggunakan stroke dash offset beranimasi, dalam warna coklat hangat atas latar putih pudar.
Kemudian isi bulatan dengan oren pekat dan tukar garis menjadi krim, dalam 0.4 saat.
