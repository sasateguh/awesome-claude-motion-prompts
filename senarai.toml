[en]
tajuk = "Awesome Claude Motion Prompts"
pembuka = "Prompts we wrote for Claude that turn into short motion graphics for reels: kinetic captions, brand intros, moving charts, transitions and app demos. Each prompt is shown with the video it produced. Below them, open-source motion tools ranked by stars and recent activity, refreshed every week."

[en.prompt]
pengenalan = "Paste a prompt into Claude as it is, then swap the words, colours and numbers for your own. Each preview was rendered with HyperFrames from code written by a new Claude session that was given the English prompt and a short note on where to save the files."
hasil = "<img src=\"{gif}\" alt=\"Preview: {tajuk}\" width=\"270\">\n\n[Video (MP4)]({mp4}) · [Source]({kod})"

[ms]
tajuk = "Senarai Prompt Motion Claude"
pembuka = "Prompt yang kami tulis untuk Claude bagi menghasilkan motion graphic pendek untuk reel: kapsyen kinetik, pembuka jenama, carta bergerak, peralihan dan demo aplikasi. Setiap prompt dipapar bersama video yang dihasilkannya. Di bawahnya, alat motion sumber terbuka dipangkat ikut bintang dan aktiviti terkini, dikemas setiap minggu."

[ms.prompt]
pengenalan = "Tampal prompt ke dalam Claude seperti sedia ada, kemudian tukar perkataan, warna dan nombor kepada milik anda. Setiap pratonton dirender dengan HyperFrames daripada kod yang ditulis oleh sesi Claude baharu yang hanya diberi prompt bahasa Inggeris dan nota ringkas tentang tempat menyimpan fail."
hasil = "<img src=\"{gif}\" alt=\"Pratonton: {tajuk}\" width=\"270\">\n\n[Video (MP4)]({mp4}) · [Kod sumber]({kod})"

[github]
# Topik: `gilap topik --deskripsi "<penerangan>" --wajib awesome,awesome-list --tambah hyperframes,remotion,reels,malay,
# motion-design,kinetic-typography,video-prompts,bahasa-melayu,claude-code,animation` 29 Okt 2026. Dipilih dari calon ✓ ikut
# makna: claude-code + animation (luas, pembaca lain) dan remotion (isi kita HyperFrames; Remotion hanya entri) ditolak.
penerangan = "Claude prompts for motion graphics and short-form reels in English and Malay, each shown with the video it produced, plus ranked open-source motion tools."
topik = ["awesome", "awesome-list", "claude", "prompts", "claude-prompts", "motion-graphics", "motion-design", "kinetic-typography", "hyperframes", "reels", "video-prompts", "malay"]

[pangkat]
bintang = 1.0
aktif = 1.0

[ambang]
bintang_min = 50
hari_tidak_aktif = 365

[papar]
# D70 (M5): GitHub tidak membalut blok kod; baris prompt dibalut pada lebar ini supaya boleh dibaca di telefon tanpa
# menatal mendatar. Diukur WebKit iPhone 13: kotak kod 310 px / 8.16 px seaksara = 38; kad README GitHub telefon
