# Dua bahagian. (1) [[prompt]] = prompt yang KITA tulis sendiri, EN + BM (K3): setiap satu menghasilkan klip motion pendek
# dengan HTML + CSS + fon sistem sahaja (tiada imej/ikon/fon pihak ketiga dalam hasil), nilai contoh boleh ditukar pembaca,
# satu kategori K10. Tiada prompt orang lain, tiada parafrasa repo tanpa lesen, tiada apa-apa dari kandungan partner.
# Tajuk prompt TIDAK ditukar selepas terbit (K11: sauh dipaut sistem balasan Threads). `hasil` diisi M3/M4 (contoh dirender).
